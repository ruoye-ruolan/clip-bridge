name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Format and lint both crates
        run: make check
      - name: Test both crates
        run: make test

  linux-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Format, lint and test the Linux companion
        run: |
          cargo fmt --manifest-path remote/Cargo.toml --check
          cargo clippy --manifest-path remote/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path remote/Cargo.toml --locked
