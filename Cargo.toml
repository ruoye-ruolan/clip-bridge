[package]
name = "clipbridge"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Preserve macOS clipboard images and sync them to remote SSH applications"
default-run = "clipbridge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
glob = "0.3"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.31", features = ["signal", "process", "fs"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString"] }

[profile.release]
strip = true
lto = "thin"
