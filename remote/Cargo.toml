[package]
name = "clipbridge-remote"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Private Linux clipboard bridge for remote terminal applications"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.31", features = ["signal", "process", "user", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
